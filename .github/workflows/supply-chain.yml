name: supply-chain

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Ensure origin/main exists
        run: git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main

      # On a push, origin/main IS the commit being checked, so nothing looks
      # changed and the cooling-off check silently passes everything. Repoint
      # it at what main was before the push.
      - name: Point origin/main at the pre-push commit
        if: >-
          github.event_name == 'push' &&
          github.event.before != '0000000000000000000000000000000000000000'
        run: |
          git fetch --no-tags origin ${{ github.event.before }}
          git update-ref refs/remotes/origin/main ${{ github.event.before }}

      - name: Supply-chain gate
        run: python3 .githooks/supply_chain_gate.py
